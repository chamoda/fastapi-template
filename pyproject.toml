[project]
name = "app"
version = "0.1.0"
description = ""
authors = [
    {name = "Chamoda Pandithage", email = "chamoda@xaventra.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "python-jose[cryptography]>=3.5.0",
    "typer>=0.24.2",
    "fastapi-pagination>=0.15.12",
    "asyncpg>=0.31.0",
    "pydantic-extra-types>=2.11.1",
    "httpx>=0.28.1",
    "fastapi-mail>=1.6.2",
    "slowapi>=0.1.9",
    "redis>=7.4.0",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.0",
    "pyinfra>=3.7",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "testcontainers>=4.14.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::RuntimeWarning:asyncpg.*",
    "ignore::RuntimeWarning:sqlalchemy.*",
    "ignore:coroutine.*was never awaited:RuntimeWarning"
]

[tool.pyright]
include = ["app"]
ignore = ["migrations/*"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "faker>=40.15.0",
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.14.2",
]
